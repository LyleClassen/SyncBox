[package]
name = "syncbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "syncbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rbox = { version = "0.3", default-features = false, features = ["master-db", "anlz", "bundled-vendored-openssl"] }
rusqlite = "0.40"
thiserror = "2.0.21"
log = "0.4.35"
tauri-plugin-log = "2"
diesel = { version = "2.4", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "wav"] }
# Not used directly: enables AIFF and ALAC in the symphonia that rodio decodes with.
symphonia = { version = "0.5.5", default-features = false, features = ["aiff", "pcm", "alac"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
